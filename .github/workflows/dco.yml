# SPDX-License-Identifier: Apache-2.0
name: DCO
on:
  pull_request:
permissions:
  contents: read
jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Every commit is signed off (git commit -s)
        run: node scripts/check-dco.mjs "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"
